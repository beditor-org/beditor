[workspace]
members = ["editor", "bridge", "client", "ui"]
default-members = ["editor"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# UI & Desktop
dioxus = { version = "0.7", features = ["desktop"] }
raw-window-handle = "0.6"
lucide-dioxus = { version = "2.44.0", features = ["all-icons"] }
tracing = "0.1.43"

# Async runtime
tokio = { version = "1.48.0", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Bevy integration
bevy = { version = "0.17", default-features = false, features = ["bevy_remote"] }

# Error handling
anyhow = "1.0"

# Platform-specific
x11 = { version = "2.21", features = ["xlib"] }

# IPC
crossbeam-channel = "0.5.15"
strum = "0.27"
strum_macros = "0.27"

# Encoding
base64 = "0.22"
