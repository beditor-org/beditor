[workspace]
default-members = ["editor"]
members = ["bridge", "client", "editor", "ui"]
resolver = "2"

[workspace.package]
authors = ["Your Name <your.email@example.com>"]
edition = "2021"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
# UI & Desktop
dioxus = { version = "0.7", features = ["desktop"] }
lucide-dioxus = { version = "2.44.0", features = ["all-icons"] }
raw-window-handle = "0.6"
tracing = "0.1.43"

# Async runtime
flume = "0.12.0"
tokio = { version = "1.48.0", features = ["io-util", "rt"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Bevy integration
bevy = { version = "0.19", default-features = false, features = [
	"bevy_remote",
] }

# Error handling
anyhow = "1.0"

# Platform-specific
x11 = { version = "2.21", features = ["xlib"] }

# IPC
crossbeam-channel = "0.5.15"
strum = "0.27"
strum_macros = "0.27"

# Encoding
base64 = "0.22"

# Shared memory
memmap2 = "0.9"

#	i18n
icu_locale_core = "2.2.0"
indexmap = "2"
isolang = { version = "2", features = ["local_names"] }
