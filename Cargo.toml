[package]
name = "beditor"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus = { version = "0.7", features = ["desktop"] }
tokio = "1.48.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
bevy = { version = "0.17", default-features = false, features = ["bevy_remote"] }
x11 = { version = "2.21", features = ["xlib"] }
raw-window-handle = "0.6"
