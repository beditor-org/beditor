# Додай ці рядки до ~/.config/i3/config для роботи мульти-віконного редактора
# Layout для 2560x1440

# Всі вікна редактора робимо floating з фіксованими позиціями
for_window [title="Beditor v0.1.0"] floating enable, move position 5 5
for_window [title="Beditor - Hierarchy"] floating enable, move position 5 120
for_window [title="Beditor - Inspector"] floating enable, move position 2170 120
for_window [title="Beditor - Game Viewport"] floating enable, move position 415 120

# Альтернативний варіант - більш загальне правило:
# for_window [title=".*Panel.*|.*Viewport.*|.*Top Bar.*"] floating enable

# Після зміни конфігу перезавантаж i3:
# Mod+Shift+R або i3-msg restart
